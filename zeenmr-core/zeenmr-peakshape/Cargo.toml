[package]
name = "zeenmr-peakshape"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = """
    Data structures for representing and manipulating NMR peak shapes.
"""
readme = "README.md"
repository = "https://github.com/spang-lab/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
]
categories = [
    "science::bioinformatics",
    "data-structures",
]

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
num-traits = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
float-cmp = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true

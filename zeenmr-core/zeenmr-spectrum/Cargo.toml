[package]
name = "zeenmr-spectrum"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = """
    Data structures for representing NMR spectra and their properties.
"""
readme = "README.md"
repository = "https://github.com/SombkeMaximilian/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
    "spectrum",
]
categories = [
    "science::bioinformatics",
    "data-structures",
]

[features]
default = []
rayon = ["dep:rayon"]
serde = ["dep:serde", "dep:serde_arrays", "uom/serde"]

[dependencies]
num-complex = { workspace = true }
num-traits = { workspace = true }
uom = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_arrays = { workspace = true, optional = true }

[dev-dependencies]
float-cmp = { workspace = true }
static_assertions = { workspace = true }
serde_json5 = { workspace = true }
strum = { workspace = true }

[lints]
workspace = true

[package]
name = "zeenmr-python"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = """
    Python bindings for the ZeeNMR Rust library crate.
"""
readme = "../README.md"
repository = "https://github.com/spang-lab/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
    "deconvolution",
]
categories = [
    "science::bioinformatics",
    "mathematics",
    "data-structures",
]
publish = false

[lib]
name = "_zeenmr"
crate-type = ["cdylib"]

[dependencies]
zeenmr = { workspace = true }
numpy = { version = "0.25.0" }
pyo3 = { version = "0.25.1", features = ["extension-module"] }
rayon = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }

[lints]
workspace = true

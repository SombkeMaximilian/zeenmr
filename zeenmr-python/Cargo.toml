[package]
name = "zeenmr-python"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2021"
rust-version = "1.80.0"
description = """
    Python bindings for the ZeeNMR Rust library crate.
"""
readme = "../README.md"
repository = "https://github.com/spang-lab/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
    "deconvolution",
]
categories = [
    "science::bioinformatics",
    "mathematics",
    "data-structures",
]
publish = false

[lib]
name = "_zeenmr"
crate-type = ["cdylib"]

[dependencies]
zeenmr = { path = "../zeenmr", features = ["full"] }
numpy = "0.24.0"
pyo3 = { version = "0.24.0", features = ["extension-module"] }
rayon = "1.10.0"
serde = "1.0.218"
serde_json = "1.0.140"
rmp-serde = "1.3.0"

[lints]
workspace = true

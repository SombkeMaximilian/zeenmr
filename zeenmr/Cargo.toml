[package]
name = "zeenmr"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = """
    A library for 1D NMR spectra, offering data structure definitions,
    common NMR file format parsing (Bruker TopSpin, JCAMP-DX),
    preprocessing, signal deconvolution, and spectrum alignment.
"""
readme = "../README.md"
repository = "https://github.com/spang-lab/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
    "deconvolution",
]
categories = [
    "science::bioinformatics",
    "mathematics",
    "data-structures",
]

[features]
default = ["parallel", "alignment", "bruker", "jdx", "serde"]
full = ["parallel", "alignment", "bruker", "jdx", "serde"]
parallel = ["dep:rayon"]
alignment = ["dep:good_lp", "parallel"]
bruker = ["dep:byteorder", "dep:regex"]
jdx = ["dep:regex"]
serde = ["dep:serde"]

[dependencies]
num-traits = { workspace = true }
good_lp = { version = "1.14.0", features = ["highs"], default-features = false, optional = true }
regex = { version = "1.11.1", optional = true }
byteorder = { version = "1.5.0", optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
float-cmp = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

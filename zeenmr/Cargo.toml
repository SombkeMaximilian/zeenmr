[package]
name = "zeenmr"
version = "0.1.0"
authors = ["Maximilian Sombke <sombkemaximilian@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = """
    A library for 1D NMR spectra, offering data structure definitions,
    common NMR file format parsing (Bruker TopSpin, JCAMP-DX),
    preprocessing, signal deconvolution, and spectrum alignment.
"""
readme = "../README.md"
repository = "https://github.com/spang-lab/zeenmr"
license = "MIT"
keywords = [
    "bioinformatics",
    "metabolomics",
    "nmr",
    "deconvolution",
]
categories = [
    "science::bioinformatics",
    "mathematics",
    "data-structures",
]

[features]
default = []
parallel = []
serde = []

[dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

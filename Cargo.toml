[workspace]
resolver = "2"
members = [
    "zeenmr",
    "zeenmr-core/*",

    "zeenmr-python",

    # Internal crates
    "benches",
]

[workspace.dependencies]
zeenmr = { version = "0.1.0", path = "zeenmr" }
zeenmr-deconvolution = { version = "0.1.0", path = "zeenmr-core/zeenmr-deconvolution" }
zeenmr-peakshape = { version = "0.1.0", path = "zeenmr-core/zeenmr-peakshape" }
zeenmr-spectrum = { version = "0.1.0", path = "zeenmr-core/zeenmr-spectrum" }
zeenmr-parse = { version = "0.1.0", path = "zeenmr-core/zeenmr-parse" }

num-complex = { version = "0.4.6" }
num-traits = { version = "0.2.19" }
uom = { git = "https://github.com/iliekturtles/uom", branch = "master", default-features = false, features = ["autoconvert", "std", "si", "f64"] }

byteorder = { version = "1.5.0" }
logos = { version = "0.16.1" }

rayon = { version = "1.12.0" }

serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = { version = "1.3.1" }
serde_json = { version = "1.0.150" }

float-cmp = { version = "0.10.0" }
static_assertions = { version = "1.1.0" }
strum = { version = "0.28.0", features = ["derive"] }

criterion = { version = "0.8.2" }
rand = { version = "0.10.2" }

[profile.release]
lto = true

[profile.bench]
lto = true

[workspace.lints.rust]
unknown_lints = "allow"
unused_imports = "warn"
unreachable_pub = "warn"
2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_inception = "allow"

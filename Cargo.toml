[workspace]
resolver = "2"
members = [
    "zeenmr",
    "zeenmr-core/*",

    "zeenmr-python",

    # Internal crates
    "benches",
]

[workspace.dependencies]
zeenmr = { version = "0.1.0", path = "zeenmr" }
zeenmr-deconvolution = { version = "0.1.0", path = "zeenmr-core/zeenmr-deconvolution" }
zeenmr-peakshape = { version = "0.1.0", path = "zeenmr-core/zeenmr-peakshape" }
zeenmr-spectrum = { version = "0.1.0", path = "zeenmr-core/zeenmr-spectrum" }
zeenmr-parse = { version = "0.1.0", path = "zeenmr-core/zeenmr-parse" }

num-traits = { version = "0.2.19" }
uom = { git = "https://github.com/SombkeMaximilian/uom", branch = "gyromagnetic_ratio", default-features = false, features = ["autoconvert", "std", "si", "f64"] }

regex = { version = "1.11.2" }

rayon = { version = "1.10.0" }

serde = { version = "1.0.219", features = ["derive"] }
rmp-serde = { version = "1.3.0" }
serde_json = { version = "1.0.140" }

float-cmp = { version = "0.10.0" }
static_assertions = { version = "1.1.0" }
strum = { version = "0.27.2", features = ["derive"] }

[profile.release]
lto = true

[profile.bench]
lto = true

[workspace.lints.rust]
unknown_lints = "allow"
unused_imports = "warn"
unreachable_pub = "warn"
2018_idioms = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_inception = "allow"
